name: CI - Terraform Plan + Security + FinOps

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write # برای کامنت گذاشتن هزینه لازمه

jobs:
  commit-lint:
    name: "1. Commit Lint - اجبار کامیت درست"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit format
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json
    #  هیستوری تمیز  
  secret-scan:
    name: "2. Secret Scan - چک لو نرفتن رمز"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
    
  terraform-ci:
    name: "3. Terraform Validate + Security + FinOps Cost"
    runs-on: ubuntu-latest
    needs: [commit-lint, secret-scan]
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform fmt - فرمت تمیز؟
        run: terraform fmt -check -recursive
        

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Mask Secrets - پوشاندن رمزها
        run: |
          echo "::add-mask::${{ secrets.DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "Secrets masked in logs"
        #  لاگ گیت‌هاب نباید رمز نشون بده

      - name: Terraform Validate
        run: terraform validate

      - name: tfsec - امنیت زیرساخت
        uses: aquasecurity/tfsec-action@v1
        with:
          working_directory: terraform
          args: --soft-fail
        #  چک میکنه S3 پابلیک نباشه، RDS رمز داشته باشه -  امنیتی تسک

      - name: Setup Infracost - هزینه چقدره؟
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
        #  FinOps - باید قبل از ساخت بگی ماهانه چقدره

      - name: Generate Infracost cost JSON
        run: |
          infracost breakdown --path=.             --format=json             --out-file=/tmp/infracost.json             --terraform-var-file=terraform.tfvars.example || infracost breakdown --path=. --format=json --out-file=/tmp/infracost.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Post Infracost comment - کامنت هزینه توی PR
        run: |
          infracost comment github --path=/tmp/infracost.json             --repo=$GITHUB_REPOSITORY             --github-token=${{ secrets.GITHUB_TOKEN }}             --pull-request=${{ github.event.pull_request.number }}             --behavior=update
        #    PR  "این VPC ماهانه 32$ هزینه داره" -  FinOps

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })