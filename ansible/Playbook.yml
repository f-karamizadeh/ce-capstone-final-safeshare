---
- name: Configure SafeShare Servers
  hosts: all
  become: true

  tasks:
    - name: Install packages
      ansible.builtin.yum:
        name:
          - python3
          - python3-pip
        state: present

    - name: Create app directory
      ansible.builtin.file:
        path: /opt/safeshare
        state: directory
        mode: "0755"

    - name: Copy app file
      ansible.builtin.copy:
        src: "../app/app.py"
        dest: "/opt/safeshare/app.py"
        mode: "0644"

    - name: Restart app
      ansible.builtin.shell: |
        pkill -f app.py || true
        nohup python3 /opt/safeshare/app.py > /var/log/app.log 2>&1 &